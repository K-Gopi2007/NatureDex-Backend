services:
  - type: web
    name: naturedex-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: naturedex-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
